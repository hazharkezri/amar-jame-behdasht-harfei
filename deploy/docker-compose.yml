services:
  app:
    build: ..
    env_file: ../.env
    volumes: ["../data:/app/data"]
    restart: always
    expose: ["3000"]
  nginx:
    image: nginx:stable
    ports: ["80:80","443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app]
    restart: always
